<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glaz Studios — Wedding photography and films</title>
<meta name="description" content="Glaz Studios: wedding photography, cinematography, full coverage, media coverage and photo booth in Egypt. Since 2013.">
<!-- While the page uses temporary photos, keep it out of Google. Remove this line at launch. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3328">
<meta property="og:title" content="Glaz Studios">
<meta property="og:description" content="Wedding photography and films.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="home.css">
</head>
<body>

<a class="skip" href="#work">Skip to our work</a>

<header class="nav on-hero" id="nav">
  <a class="logo" href="/" aria-label="Glaz Studios home">GLAZ<span>STUDIOS</span></a>
  <nav class="links" id="menu" aria-label="Main">
    <a href="/" aria-current="page">Home</a>
    <a href="/about">About</a>
    <a href="/faq">FAQ</a>
    <a class="book" href="/book">Book your date</a>
  </nav>
  <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu"><span></span><span></span><span class="sr">Menu</span></button>
</header>

<main>
  <!-- Opening reel -->
  <section class="hero" id="top" aria-label="Glaz Studios">
    <div class="reel" id="reel" aria-hidden="true"></div>
    <div class="hero-shade"></div>
    <div class="hero-text">
      <h1>Here’s to the best day of your life.</h1>
      <a class="btn light" href="/book">Book your date</a>
    </div>
    <div class="reel-ui">
      <div class="ticks" id="ticks"></div>
      <button class="reel-toggle" id="reel-toggle" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pause" d="M7 5h3v14H7zM14 5h3v14h-3z"/><path class="i-play" d="M8 5l11 7-11 7z"/></svg>
      </button>
    </div>
  </section>

  <!-- Services -->
  <section class="services" aria-labelledby="services-h">
    <h2 id="services-h" class="sr">What we do</h2>
    <ul class="service-row" id="services"></ul>
  </section>

  <!-- The work -->
  <section class="work" id="work" aria-labelledby="work-h">
    <h2 id="work-h">Our work</h2>
    <div class="wall" id="wall"></div>
  </section>

  <!-- Films -->
  <section class="films" id="films" aria-labelledby="films-h">
    <h2 id="films-h">Films</h2>
    <div class="film-grid" id="film-grid"></div>
  </section>

  <!-- Close -->
  <section class="closing" id="closing">
    <div class="closing-in">
      <h2>Your date, our eyes.</h2>
      <a class="btn light" href="/book">Book your date</a>
    </div>
  </section>
</main>

<footer class="foot">
  <a class="logo" href="#top" aria-label="Back to the top">GLAZ<span>STUDIOS</span></a>
  <nav class="foot-links" id="foot-links" aria-label="Footer"></nav>
  <p>Wedding photography and films since 2013.</p>
</footer>

<!-- Photos, full screen -->
<dialog class="viewer" id="viewer" aria-label="Photo viewer">
  <span class="viewer-count" id="viewer-count" aria-live="polite"></span>
  <button class="icon-btn viewer-close" data-close aria-label="Close">✕</button>
  <div class="viewer-track" id="viewer-track" tabindex="0" aria-label="Photos — swipe or use the arrow keys"></div>
  <button class="icon-btn viewer-prev" id="viewer-prev" aria-label="Previous photo">‹</button>
  <button class="icon-btn viewer-next" id="viewer-next" aria-label="Next photo">›</button>
</dialog>

<script type="module" src="home.js"></script>
</body>
</html>
